<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Global Weather Radar | Global Weather Center</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body,#app{height:100%;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#08111f;color:#f8fafc}
#app{display:grid;grid-template-rows:auto 1fr}
header{padding:10px;background:#111b2e;border-bottom:1px solid #334155;z-index:1000}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:1rem;margin:0 8px 0 0}
button,select{border:1px solid #475569;background:#19263d;color:#f8fafc;border-radius:9px;padding:8px 10px;font:inherit}
button{cursor:pointer}
button.primary{background:#38bdf8;color:#062033;border-color:transparent;font-weight:700}
.status{font-size:.8rem;color:#bdc8d8}
#map{height:100%;width:100%;background:#0f172a}
.panel{background:rgba(9,17,31,.94);color:#f8fafc;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:10px 12px;max-width:330px;font-size:12px;line-height:1.42}
.badge{display:inline-block;border-radius:999px;padding:2px 7px;margin:2px 3px 2px 0;font-weight:750}
.hail{background:#22c55e;color:#052e16}
.tornado{background:#ef4444;color:white}
.lightning{background:#fde047;color:#211d00}
.experimental{background:#8b5cf6;color:white}
.direction{background:#38bdf8;color:#062033}
.leaflet-control-attribution{font-size:9px}
.warning-popup b{font-size:14px}
@media(max-width:720px){

  .brand{flex:1 1 100%;margin-right:0}
  .brand-title{font-size:1rem}
  .brand-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:50%;
  background:transparent;
  flex:0 0 auto;
}
  .youtube-link{flex:1 1 100%;justify-content:center}

  h1{flex:1 1 100%}
  button,select{flex:1 1 44%}
  .status{flex:1 1 100%}
}

.brand{
  display:flex;
  align-items:center;
  gap:9px;
  color:#f8fafc;
  text-decoration:none;
  margin-right:auto;
  min-width:0;
}
.brand-logo{
  width:42px;
  height:42px;
  object-fit:contain;
  border-radius:50%;
  background:transparent;
  flex:0 0 auto;
}
.brand-title{
  font-size:1.05rem;
  font-weight:800;
  white-space:nowrap;
}
.youtube-link{
  display:inline-flex;
  align-items:center;
  gap:7px;
  border-radius:9px;
  padding:8px 11px;
  color:#fff;
  background:#dc2626;
  border:1px solid #ef4444;
  text-decoration:none;
  font-weight:750;
  transition:filter .15s ease,transform .15s ease;
}
.youtube-link:hover{filter:brightness(1.12);transform:translateY(-1px)}
.youtube-icon{
  display:inline-grid;
  place-items:center;
  width:21px;
  height:21px;
  border-radius:5px;
  background:transparent;
  color:#dc2626;
  font-size:11px;
  padding-left:1px;
}


.small-hail{background:#22c55e;color:#052e16}
.medium-hail{background:#ff9800;color:#2b1600}
.large-hail{background:#ff2d2d;color:#fff}
.tornado{background:#ff4fd8;color:#2b0824}
.lightning{background:#facc15;color:#2b2400}


.youtube-svg{
  width:22px;
  height:22px;
  display:block;
  flex:0 0 auto;
}
.legend-shell{
  min-width:0;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
.legend-toggle,
.legend-close{
  appearance:none;
  border:1px solid rgba(255,255,255,.18);
  color:#f8fafc;
  cursor:pointer;
}
.legend-toggle{
  display:flex;
  align-items:center;
  gap:8px;
  background:rgba(9,17,31,.94);
  border-radius:12px;
  padding:10px 13px;
  font-weight:750;
  box-shadow:0 8px 28px rgba(0,0,0,.3);
  backdrop-filter:blur(10px);
}
.legend-toggle:hover{background:rgba(20,31,51,.97)}
.legend-menu-icon{font-size:16px}
.legend-panel{
  width:min(270px,calc(100vw - 28px));
  background:rgba(9,17,31,.96);
  border:1px solid rgba(255,255,255,.18);
  border-radius:14px;
  padding:12px;
  color:#f8fafc;
  box-shadow:0 10px 34px rgba(0,0,0,.35);
  backdrop-filter:blur(12px);
}
.legend-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding-bottom:9px;
  border-bottom:1px solid rgba(255,255,255,.12);
}
.legend-close{
  width:30px;
  height:30px;
  border-radius:9px;
  padding:0;
  background:rgba(255,255,255,.07);
  font-size:21px;
  line-height:1;
}
.legend-list{
  display:grid;
  gap:9px;
  padding:11px 0 8px;
}
.legend-list>div{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:13px;
}
.legend-swatch{
  width:30px;
  height:16px;
  border-radius:5px;
  border-width:4px;
  border-style:solid;
  background:transparent;
  flex:0 0 auto;
}
.lightning-swatch{border-color:#facc15}
.small-hail-swatch{border-color:#22c55e}
.medium-hail-swatch{border-color:#f97316}
.large-hail-swatch{border-color:#ef4444}
.tornado-swatch{border-color:#ff4fd8}
.legend-arrow{
  width:30px;
  text-align:center;
  font-size:23px;
  color:#38bdf8;
  line-height:16px;
}
.legend-note{
  padding-top:9px;
  border-top:1px solid rgba(255,255,255,.12);
  color:#b9c5d8;
  font-size:11px;
  line-height:1.4;
}


@media(max-width:720px){
  .youtube-link{
    flex:1 1 100%;
    justify-content:center;
  }
  .legend-panel{
    width:min(260px,calc(100vw - 24px));
  }
}





.legend-tabs{display:flex;gap:6px;margin:10px 0}
.legend-tab{flex:1;padding:6px 8px;border-radius:8px;background:#1f2937;color:#fff;border:1px solid #374151;text-align:center;font-weight:700;cursor:pointer}
.legend-tab.active{background:#2563eb}
.legend-page{display:none}
.legend-page.active{display:block}
.radar-scale{display:grid;gap:6px}
.radar-row{display:flex;align-items:center;gap:8px;font-size:13px}
.radar-box{width:26px;height:14px;border-radius:4px}


.storm-hazard-label{
  background:rgba(9,17,31,.92);
  border:1px solid rgba(255,255,255,.22);
  border-radius:7px;
  color:#fff;
  box-shadow:0 3px 12px rgba(0,0,0,.35);
  font-size:11px;
  font-weight:800;
  letter-spacing:.02em;
  padding:4px 7px;
  text-transform:uppercase;
}
.storm-hazard-label:before{display:none}


.draw-control{
  display:flex;
  flex-direction:column;
  gap:8px;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
.draw-toggle{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid rgba(255,255,255,.18);
  border-radius:10px;
  background:rgba(9,17,31,.95);
  color:#fff;
  cursor:pointer;
  box-shadow:0 5px 18px rgba(0,0,0,.28);
  font-size:19px;
}
.draw-toggle.active{
  background:#2563eb;
}
.draw-panel{
  width:210px;
  padding:11px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:12px;
  background:rgba(9,17,31,.96);
  color:#fff;
  box-shadow:0 8px 28px rgba(0,0,0,.34);
  backdrop-filter:blur(10px);
}
.draw-head{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:center;
  margin-bottom:10px;
}
.draw-head strong{font-size:13px}
.draw-close{
  width:29px;
  height:29px;
  border-radius:8px;
  border:1px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.07);
  color:#fff;
  cursor:pointer;
  font-size:19px;
  line-height:1;
}
.draw-colours{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:10px;
}
.draw-colour{
  width:26px;
  height:26px;
  padding:0;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.3);
  cursor:pointer;
}
.draw-colour.selected{
  outline:2px solid #fff;
  outline-offset:2px;
}
.draw-custom-colour{
  width:34px;
  height:28px;
  padding:0;
  border:0;
  background:transparent;
  cursor:pointer;
}
.draw-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
.draw-action{
  border:1px solid rgba(255,255,255,.16);
  background:#19263d;
  color:#fff;
  border-radius:9px;
  padding:8px 9px;
  cursor:pointer;
  font-size:12px;
  font-weight:700;
}
.draw-action.primary{background:#2563eb}
.draw-action.danger{background:#7f1d1d}
.draw-help{
  margin-top:9px;
  color:#b9c5d8;
  font-size:11px;
  line-height:1.35;
}
.leaflet-container.draw-mode{
  cursor:crosshair!important;
  touch-action:none!important;
  -webkit-user-select:none!important;
  user-select:none!important;
}
.draw-control{
  pointer-events:auto;
}


#fixedDrawTool{
  position:absolute;
  left:14px;
  top:310px;
  z-index:5000;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
}
#fixedDrawButton{
  width:44px;height:44px;border:1px solid rgba(255,255,255,.22);
  border-radius:11px;background:#0b1729;color:#fff;
  box-shadow:0 5px 18px rgba(0,0,0,.4);font-size:23px;font-weight:800;
  display:grid;place-items:center;cursor:pointer;
}
#fixedDrawButton.active{background:#2563eb}
#fixedDrawPanel{
  position:absolute;
  left:54px;
  top:0;
  width:226px;
  padding:12px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:12px;
  background:rgba(9,17,31,.97);
  color:#fff;
  box-shadow:0 8px 28px rgba(0,0,0,.42);
}
#fixedDrawPanel[hidden]{display:none!important}
.fd-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:11px;
}
.fd-head strong{font-size:13px}
.fd-x{width:29px;height:29px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:#18263c;color:#fff;font-size:20px}
.fd-colours{
  display:grid;
  grid-template-columns:repeat(6,27px);
  justify-content:space-between;
  align-items:center;
  gap:7px;
  margin-bottom:11px;
}
.fd-colour{
  width:27px;
  height:27px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.28);
  padding:0;
  margin:0;
  appearance:none;
  -webkit-appearance:none;
}
.fd-colour.selected{outline:2px solid #fff;outline-offset:2px}
.fd-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  align-items:stretch;
}
.fd-actions button{
  height:36px;
  border:1px solid rgba(255,255,255,.18);
  border-radius:8px;
  padding:0 10px;
  background:#19263d;
  color:#fff;
  font-weight:700;
  display:flex;
  align-items:center;
  justify-content:center;
}
.fd-actions .fd-done{background:#2563eb}
.fd-help{font-size:11px;color:#bdc8d8;line-height:1.35;margin-top:9px}
#map.fixed-draw-active{touch-action:none!important;cursor:crosshair!important}


#fixedDrawPanel input[type="color"],
#fixedDrawPanel .fd-custom,
#fixedDrawPanel .draw-custom-colour{
  display:none!important;
  width:0!important;
  height:0!important;
  padding:0!important;
  margin:0!important;
  border:0!important;
  position:absolute!important;
  pointer-events:none!important;
}

#fixedDrawPanel{
  box-sizing:border-box;
}

.fd-colours{
  display:flex!important;
  flex-wrap:nowrap!important;
  align-items:center!important;
  justify-content:space-between!important;
  width:100%!important;
  gap:8px!important;
  margin:0 0 12px 0!important;
}

.fd-colour{
  flex:0 0 28px!important;
  width:28px!important;
  height:28px!important;
  min-width:28px!important;
  max-width:28px!important;
  min-height:28px!important;
  max-height:28px!important;
  border-radius:50%!important;
  padding:0!important;
  margin:0!important;
  line-height:0!important;
}

.fd-actions{
  width:100%!important;
  grid-template-columns:1fr 1fr!important;
}

.fd-actions button{
  width:100%!important;
  min-width:0!important;
  box-sizing:border-box!important;
}

@media(max-width:600px){
  #fixedDrawTool{
    left:20px!important;
    top:170px!important;
  }
  #fixedDrawPanel{
    left:0!important;
    top:58px!important;
    width:min(468px,calc(100vw - 40px))!important;
    max-width:468px!important;
  }
  .fd-colours{
    justify-content:flex-start!important;
    gap:14px!important;
  }
}


#fixedDrawPanel input[type="color"]{display:none!important}
.fd-colours{
  display:grid!important;
  grid-template-columns:repeat(6,28px)!important;
  justify-content:space-between!important;
  align-items:center!important;
  gap:8px!important;
  margin:0 0 12px 0!important;
}
.fd-colour{
  width:28px!important;
  height:28px!important;
  min-width:28px!important;
  min-height:28px!important;
  border-radius:50%!important;
  padding:0!important;
  margin:0!important;
}


#fixedDrawTool{
  pointer-events:auto!important;
  z-index:10000!important;
}
#fixedDrawButton,
#fixedDrawPanel,
#fixedDrawPanel button{
  pointer-events:auto!important;
  touch-action:manipulation!important;
}
#fixedDrawPanel input[type="color"]{display:none!important}
.fd-colours{
  display:grid!important;
  grid-template-columns:repeat(6,28px)!important;
  gap:12px!important;
  justify-content:start!important;
  align-items:center!important;
  margin:0 0 12px 0!important;
}
.fd-colour{
  width:28px!important;
  height:28px!important;
  min-width:28px!important;
  min-height:28px!important;
  max-width:28px!important;
  max-height:28px!important;
  border-radius:50%!important;
  padding:0!important;
  margin:0!important;
}

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const map=window.gwrMap=L.map('map',{zoomControl:true,minZoom:2,maxZoom:18,worldCopyJump:true}).setView([30,0],3);
  
  map.getPane('tilePane').style.zIndex='200';
  map.createPane('radarPane');
  map.getPane('radarPane').style.zIndex='350';
  map.createPane('warningPane');
  map.createPane('drawingPane');
  map.getPane('drawingPane').style.zIndex='720';
  map.getPane('warningPane').style.zIndex='650';

  const basemaps={
    voyager:L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
      {
        subdomains:'abcd',
        maxZoom:20,
        attribution:'© OpenStreetMap contributors © CARTO'
      }
    ),
    light:L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
      {
        subdomains:'abcd',
        maxZoom:20,
        attribution:'© OpenStreetMap contributors © CARTO'
      }
    ),
    dark:L.tileLayer(
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
      {
        subdomains:'abcd',
        maxZoom:20,
        attribution:'© OpenStreetMap contributors © CARTO'
      }
    )
  };

  let activeBasemap=basemaps.dark.addTo(map);

  const status=document.getElementById('status');
  const opacityEl=document.getElementById('opacity');
  const basemapEl=document.getElementById('basemap');
  basemapEl.value='dark';
  const sensitivityEl=document.getElementById('sensitivity');

  let frames=[],host='',frameIndex=0,radarLayer=null,timer=null,playing=true;
  const warningLayer=L.layerGroup().addTo(map);

  const legend=L.control({position:'bottomleft'});
  legend.onAdd=()=>{
    const wrap=L.DomUtil.create('div','legend-shell');
    wrap.innerHTML=`
<button type="button" class="legend-toggle"><span>☰</span><span>Legend</span></button>
<div class="legend-panel" hidden>
<div class="legend-head"><strong>Legend</strong><button type="button" class="legend-close">×</button></div>
<div class="legend-tabs">
<button class="legend-tab active" data-page="warn">Warnings</button>
<button class="legend-tab" data-page="radar">Radar</button>
</div>
<div id="warn" class="legend-page active">
<div class="legend-list">
<div><span class="legend-swatch lightning-swatch"></span>Lightning likelihood</div>
<div><span class="legend-swatch small-hail-swatch"></span>Small hail signal signal</div>
<div><span class="legend-swatch medium-hail-swatch"></span>Medium hail signal signal</div>
<div><span class="legend-swatch large-hail-swatch"></span>Large hail signal signal</div>
<div><span class="legend-swatch tornado-swatch"></span>Hook echo candidate</div>

</div>
</div>
<div id="radar" class="legend-page">
<div class="radar-scale">
<div class="radar-row"><span class="radar-box" style="background:#9ca3af"></span>No precipitation</div>
<div class="radar-row"><span class="radar-box" style="background:#60a5fa"></span>Light rain</div>
<div class="radar-row"><span class="radar-box" style="background:#22c55e"></span>Moderate rain</div>
<div class="radar-row"><span class="radar-box" style="background:#fde047"></span>Heavy rain</div>
<div class="radar-row"><span class="radar-box" style="background:#f97316"></span>Very heavy rain</div>
<div class="radar-row"><span class="radar-box" style="background:#ef4444"></span>Intense rain</div>
<div class="radar-row"><span class="radar-box" style="background:#a855f7"></span>Extreme reflectivity</div>
</div>
</div>
</div>`;

    const toggle=wrap.querySelector('.legend-toggle');
    const panel=wrap.querySelector('.legend-panel');
    const close=wrap.querySelector('.legend-close');

    L.DomEvent.disableClickPropagation(wrap);
    L.DomEvent.disableScrollPropagation(wrap);

    const setOpen=(open)=>{
      panel.hidden=!open;
      toggle.hidden=open;
      toggle.setAttribute('aria-expanded',String(open));
    };

    toggle.addEventListener('click',()=>setOpen(true));
    close.addEventListener('click',()=>setOpen(false));
    wrap.querySelectorAll('.legend-tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        wrap.querySelectorAll('.legend-tab').forEach(b=>b.classList.remove('active'));
        wrap.querySelectorAll('.legend-page').forEach(p=>p.classList.remove('active'));
        btn.classList.add('active');
        wrap.querySelector('#'+btn.dataset.page).classList.add('active');
      });
    });

    return wrap;
  };
  legend.addTo(map);


  const summary=L.control({position:'topright'});
  summary.onAdd=()=>{
    const div=L.DomUtil.create('div','panel');
    div.id='summary';
    div.innerHTML='<b>No polygons generated.</b><br>Move to a storm and press “Analyse visible area”.';
    return div;
  };
  summary.addTo(map);

  function radarUrl(frame){
    return `${host}${frame.path}/256/{z}/{x}/{y}/2/1_1.png`;
  }

  function showFrame(i){
    if(!frames.length)return;
    frameIndex=Math.max(0,Math.min(i,frames.length-1));
    if(radarLayer)map.removeLayer(radarLayer);
    radarLayer=L.tileLayer(radarUrl(frames[frameIndex]),{
      tileSize:256,
      minZoom:2,
      maxNativeZoom:7,
      maxZoom:18,
      opacity:Number(opacityEl.value),
      updateWhenZooming:false,
      updateWhenIdle:true,
      keepBuffer:10,
      noWrap:false,
      pane:'radarPane',
      attribution:'Radar © RainViewer'
    }).addTo(map);
    const date=new Date(frames[frameIndex].time*1000);
    status.textContent=`Global radar: ${date.toLocaleString('en-GB')}`;
  }

  function startAnimation(){
    clearInterval(timer);
    timer=setInterval(()=>showFrame(frameIndex>=frames.length-1?0:frameIndex+1),900);
  }

  async function loadRadar(){
    try{
      const response=await fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'});
      if(!response.ok)throw new Error(`Radar API ${response.status}`);
      const data=await response.json();
      host=data.host;
      frames=data.radar?.past||[];
      if(frames.length<2)throw new Error('Insufficient radar frames');
      showFrame(frames.length-1);
      startAnimation();
    }catch(error){
      console.error(error);
      status.textContent='Radar failed to load. Check GitHub Pages URL and internet connection.';
    }
  }

  function worldPixel(lat,lon,z){
    const scale=256*Math.pow(2,z);
    const x=(lon+180)/360*scale;
    const sin=Math.sin(lat*Math.PI/180);
    const y=(0.5-Math.log((1+sin)/(1-sin))/(4*Math.PI))*scale;
    return {x,y};
  }

  function pixelToLatLon(x,y,z){
    const scale=256*Math.pow(2,z);
    const lon=x/scale*360-180;
    const n=Math.PI-2*Math.PI*y/scale;
    const lat=180/Math.PI*Math.atan(Math.sinh(n));
    return {lat,lon};
  }

  async function loadTile(frame,z,x,y){
    const count=Math.pow(2,z);
    const wrappedX=((x%count)+count)%count;
    const url=`${host}${frame.path}/256/${z}/${wrappedX}/${y}/2/0_0.png`;
    return await new Promise((resolve,reject)=>{
      const image=new Image();
      image.crossOrigin='anonymous';
      image.onload=()=>{
        const canvas=document.createElement('canvas');
        canvas.width=256;canvas.height=256;
        const ctx=canvas.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(image,0,0);
        try{resolve(ctx.getImageData(0,0,256,256))}
        catch(error){reject(error)}
      };
      image.onerror=reject;
      image.src=url;
    });
  }

  // RainViewer Universal Blue colour table, mapped to calibrated dBZ.
  // These high-reflectivity colours are the only ones used by the hazard detector.
  const universalBlueDbz=[
    [35,255,238,0],[36,255,224,0],[37,255,210,0],[38,255,197,0],
    [39,255,183,0],[40,255,170,0],[41,255,159,0],[42,255,149,0],
    [43,255,139,0],[44,255,129,0],[45,255,68,0],[46,242,54,0],
    [47,230,40,0],[48,217,27,0],[49,205,13,0],[50,193,0,0],
    [51,168,0,0],[52,143,0,0],[53,118,0,0],[54,93,0,0],
    [55,255,170,255],[56,255,159,255],[57,255,149,255],
    [58,255,139,255],[59,255,129,255],[60,255,119,255],
    [61,255,108,255],[62,255,98,255],[63,255,88,255],
    [64,255,78,255],[65,255,255,255]
  ];

  function dbzAt(data,index){
    const r=data[index],g=data[index+1],b=data[index+2],a=data[index+3];
    if(a<80)return null;

    let bestDbz=null;
    let bestDistance=Infinity;

    for(const [dbz,cr,cg,cb] of universalBlueDbz){
      const distance=(r-cr)*(r-cr)+(g-cg)*(g-cg)+(b-cb)*(b-cb);
      if(distance<bestDistance){
        bestDistance=distance;
        bestDbz=dbz;
      }
    }

    // Reject colours too far away from the official palette.
    return bestDistance<=1800 ? bestDbz : null;
  }

  async function analyseFrame(frame,z,tileX,tileY){
    const image=await loadTile(frame,z,tileX,tileY);
    const strict=sensitivityEl.value==='veryStrict';
    const baseThreshold=strict?44:40;
    const points=[];
    const step=3;

    for(let y=0;y<256;y+=step){
      for(let x=0;x<256;x+=step){
        const index=(y*256+x)*4;
        const dbz=dbzAt(image.data,index);
        if(dbz!==null && dbz>=baseThreshold){
          points.push({x,y,dbz});
        }
      }
    }

    const clusters=[];
    for(const point of points.sort((a,b)=>b.dbz-a.dbz).slice(0,1800)){
      let cluster=clusters.find(c=>Math.hypot(c.x-point.x,c.y-point.y)<22);

      if(!cluster){
        cluster={
          x:point.x,
          y:point.y,
          n:1,
          maxDbz:point.dbz,
          values:[point.dbz],
          points:[point]
        };
        clusters.push(cluster);
      }else{
        cluster.x=(cluster.x*cluster.n+point.x)/(cluster.n+1);
        cluster.y=(cluster.y*cluster.n+point.y)/(cluster.n+1);
        cluster.n++;
        cluster.maxDbz=Math.max(cluster.maxDbz,point.dbz);
        cluster.values.push(point.dbz);
        cluster.points.push(point);
      }
    }

    for(const cluster of clusters){
      cluster.values.sort((a,b)=>a-b);
      const q=index=>cluster.values[Math.min(cluster.values.length-1,Math.max(0,index))];
      cluster.p75Dbz=q(Math.floor(cluster.values.length*.75));
      cluster.p90Dbz=q(Math.floor(cluster.values.length*.90));
      cluster.core50=cluster.values.filter(v=>v>=50).length;
      cluster.core55=cluster.values.filter(v=>v>=55).length;
      cluster.core60=cluster.values.filter(v=>v>=60).length;

      const xs=cluster.points.map(p=>p.x);
      const ys=cluster.points.map(p=>p.y);
      const width=Math.max(...xs)-Math.min(...xs)+step;
      const height=Math.max(...ys)-Math.min(...ys)+step;
      cluster.boundingArea=Math.max(1,width*height);
      cluster.compactness=Math.min(1,(cluster.n*step*step)/cluster.boundingArea);
    }

    return clusters
      .filter(c=>c.n>=(strict?10:8) && c.p75Dbz>=baseThreshold)
      .sort((a,b)=>
        (b.maxDbz+b.p90Dbz+b.core55*.4)-
        (a.maxDbz+a.p90Dbz+a.core55*.4)
      )
      .slice(0,8);
  }

  function matchPrevious(current,previous){
    let best=null,bestDistance=Infinity;
    for(const candidate of previous){
      const distance=Math.hypot(current.x-candidate.x,current.y-candidate.y);
      if(distance<bestDistance&&distance<65){best=candidate;bestDistance=distance}
    }
    return best;
  }

  function bearingFromVector(dx,dy){
    const degrees=(Math.atan2(dx,-dy)*180/Math.PI+360)%360;
    return degrees;
  }

  function directionName(bearing){
    const names=['N','NE','E','SE','S','SW','W','NW'];
    return names[Math.round(bearing/45)%8];
  }

  function destination(lat,lon,bearing,distanceKm){
    const R=6371;
    const br=bearing*Math.PI/180;
    const d=distanceKm/R;
    const lat1=lat*Math.PI/180;
    const lon1=lon*Math.PI/180;
    const lat2=Math.asin(Math.sin(lat1)*Math.cos(d)+Math.cos(lat1)*Math.sin(d)*Math.cos(br));
    const lon2=lon1+Math.atan2(Math.sin(br)*Math.sin(d)*Math.cos(lat1),Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
    return [lat2*180/Math.PI,lon2*180/Math.PI];
  }

  function offsetPoint(lat,lon,bearing,distanceKm){
    return destination(lat,lon,bearing,distanceKm);
  }

  function createWarningSquare(lat,lon,halfSizeKm){
    const north=destination(lat,lon,0,halfSizeKm);
    const east=destination(lat,lon,90,halfSizeKm);
    const south=destination(lat,lon,180,halfSizeKm);
    const west=destination(lat,lon,270,halfSizeKm);

    return [
      [north[0],west[1]],
      [north[0],east[1]],
      [south[0],east[1]],
      [south[0],west[1]]
    ];
  }


  function convexHull(points){
    if(points.length<3) return points;
    const sorted=[...points].sort((a,b)=>a.x===b.x?a.y-b.y:a.x-b.x);
    const cross=(o,a,b)=>(a.x-o.x)*(b.y-o.y)-(a.y-o.y)*(b.x-o.x);
    const lower=[];
    for(const p of sorted){
      while(lower.length>=2 && cross(lower[lower.length-2],lower[lower.length-1],p)<=0) lower.pop();
      lower.push(p);
    }
    const upper=[];
    for(let i=sorted.length-1;i>=0;i--){
      const p=sorted[i];
      while(upper.length>=2 && cross(upper[upper.length-2],upper[upper.length-1],p)<=0) upper.pop();
      upper.push(p);
    }
    upper.pop();
    lower.pop();
    return lower.concat(upper);
  }

  function createClusterPolygon(cluster,tileX,tileY,z,paddingPixels=10){
    const hull=convexHull(cluster.points);
    if(hull.length<3){
      return createWarningSquare(
        pixelToLatLon(tileX*256+cluster.x,tileY*256+cluster.y,z).lat,
        pixelToLatLon(tileX*256+cluster.x,tileY*256+cluster.y,z).lon,
        12
      );
    }

    return hull.map(point=>{
      const dx=point.x-cluster.x;
      const dy=point.y-cluster.y;
      const distance=Math.hypot(dx,dy)||1;
      const expandedX=point.x+(dx/distance)*paddingPixels;
      const expandedY=point.y+(dy/distance)*paddingPixels;
      const ll=pixelToLatLon(tileX*256+expandedX,tileY*256+expandedY,z);
      return [ll.lat,ll.lon];
    });
  }

  async function reversePlace(lat,lon){
    const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}&zoom=10&addressdetails=1`;
    const response=await fetch(url,{headers:{'Accept-Language':'en'}});
    if(!response.ok)return null;
    const data=await response.json();
    const a=data.address||{};
    return a.city||a.town||a.village||a.municipality||a.county||data.display_name?.split(',')[0]||null;
  }

  function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

  async function impactedPlaces(lat,lon,bearing,lengthKm){
    const samples=[
      destination(lat,lon,bearing,lengthKm*.25),
      destination(lat,lon,bearing,lengthKm*.58),
      destination(lat,lon,bearing,lengthKm*.92)
    ];
    const names=[];
    for(const sample of samples){
      try{
        const name=await reversePlace(sample[0],sample[1]);
        if(name&&!names.includes(name))names.push(name);
      }catch(error){}
      await wait(1050);
    }
    return names;
  }

  function hasHookShape(cluster){
    const bins=new Array(16).fill(0);
    for(const p of cluster.points){
      const dx=p.x-cluster.x,dy=p.y-cluster.y;
      const radius=Math.hypot(dx,dy);
      if(radius>10&&radius<48){
        let angle=Math.atan2(dy,dx);
        if(angle<0)angle+=Math.PI*2;
        bins[Math.floor(angle/(Math.PI*2)*16)%16]++;
      }
    }
    let best=0,run=0;
    for(let i=0;i<32;i++){
      if(bins[i%16]>0){run++;best=Math.max(best,run)}else run=0;
    }
    const empty=bins.filter(v=>v===0).length;
    return best>=5&&best<=11&&empty>=4&&cluster.maxDbz>=210;
  }

  async function analyseVisible(){
    if(frames.length<2){
      status.textContent='Radar frames are not ready yet.';
      return;
    }

    warningLayer.clearLayers();
    document.getElementById('summary').innerHTML='<b>Analysing radar motion…</b><br>This can take several seconds.';

    const analysisZoom=Math.max(4,Math.min(7,Math.round(map.getZoom())));
    const centre=map.getCenter();
    const world=worldPixel(centre.lat,centre.lng,analysisZoom);
    const tileX=Math.floor(world.x/256);
    const tileY=Math.floor(world.y/256);

    try{
      const currentFrame=frames[frames.length-1];
      const previousFrame=frames[Math.max(0,frames.length-3)];
      const olderFrame=frames[Math.max(0,frames.length-5)];
      const [current,previous,olderPrevious]=await Promise.all([
        analyseFrame(currentFrame,analysisZoom,tileX,tileY),
        analyseFrame(previousFrame,analysisZoom,tileX,tileY),
        analyseFrame(olderFrame,analysisZoom,tileX,tileY)
      ]);

      const issued=[];
      for(const cluster of current){
        const older=matchPrevious(cluster,previous);
        const oldest=older ? matchPrevious(older,olderPrevious) : null;
        let dx=older?cluster.x-older.x:7;
        let dy=older?cluster.y-older.y:-3;
        if(Math.hypot(dx,dy)<2){dx=7;dy=-3}

        const bearing=bearingFromVector(dx,dy);
        const speedFactor=Math.min(2.2,Math.max(.65,Math.hypot(dx,dy)/9));
        const worldX=tileX*256+cluster.x;
        const worldY=tileY*256+cluster.y;
        const ll=pixelToLatLon(worldX,worldY,analysisZoom);

        const strict=sensitivityEl.value==='veryStrict';

        const olderMatch=older || null;
        const oldestMatch=oldest || null;

        const twoFramePersistent=!!olderMatch;
        const threeFramePersistent=!!olderMatch && !!oldestMatch;

        const movement1=twoFramePersistent
          ? {dx:cluster.x-olderMatch.x,dy:cluster.y-olderMatch.y}
          : null;
        const movement2=threeFramePersistent
          ? {dx:olderMatch.x-oldestMatch.x,dy:olderMatch.y-oldestMatch.y}
          : null;

        const movementPixels=movement1
          ? Math.hypot(movement1.dx,movement1.dy)
          : null;

        const olderMovementPixels=movement2
          ? Math.hypot(movement2.dx,movement2.dy)
          : null;

        let motionConsistency=0;
        if(movement1 && movement2){
          const dot=movement1.dx*movement2.dx+movement1.dy*movement2.dy;
          const denom=Math.max(
            1,
            Math.hypot(movement1.dx,movement1.dy)*
            Math.hypot(movement2.dx,movement2.dy)
          );
          motionConsistency=Math.max(-1,Math.min(1,dot/denom));
        }

        const stableMotion =
          threeFramePersistent &&
          motionConsistency >= (strict?.75:.58) &&
          movementPixels >= 1 &&
          movementPixels <= 52 &&
          olderMovementPixels >= 1 &&
          olderMovementPixels <= 52;

        const lightningDetected =
          twoFramePersistent &&
          cluster.maxDbz >= (strict?51:48) &&
          cluster.p90Dbz >= (strict?47:45) &&
          cluster.n >= (strict?14:11) &&
          olderMatch.maxDbz >= (strict?47:45);

        const smallHail =
          twoFramePersistent &&
          cluster.maxDbz >= (strict?55:53) &&
          cluster.p90Dbz >= (strict?50:48) &&
          cluster.core50 >= (strict?10:7) &&
          cluster.compactness >= (strict?.20:.16) &&
          olderMatch.maxDbz >= (strict?52:50) &&
          olderMatch.p90Dbz >= (strict?47:45);

        const mediumHail =
          twoFramePersistent &&
          cluster.maxDbz >= (strict?60:58) &&
          cluster.p90Dbz >= (strict?54:52) &&
          cluster.core55 >= (strict?7:4) &&
          cluster.compactness >= (strict?.22:.18) &&
          olderMatch.maxDbz >= (strict?57:55);

        const largeHail =
          threeFramePersistent &&
          cluster.maxDbz >= (strict?64:63) &&
          cluster.p90Dbz >= (strict?59:57) &&
          cluster.core60 >= (strict?5:3) &&
          cluster.compactness >= (strict?.24:.20) &&
          olderMatch.maxDbz >= (strict?61:59) &&
          oldestMatch.maxDbz >= (strict?58:56);

        const hailType =
          largeHail ? 'Large hail signal' :
          mediumHail ? 'Medium hail signal' :
          smallHail ? 'Small hail signal' :
          null;

        const hook =
          threeFramePersistent &&
          stableMotion &&
          hasHookShape(cluster) &&
          hasHookShape(olderMatch) &&
          cluster.maxDbz >= (strict?56:53) &&
          cluster.p90Dbz >= (strict?50:48) &&
          cluster.compactness >= (strict?.22:.18) &&
          cluster.n >= (strict?14:11);

        if(!lightningDetected && !hailType && !hook) continue;

        const hazards=[];
        if(lightningDetected) hazards.push('Lightning likelihood');
        if(hailType) hazards.push(hailType);
        if(hook) hazards.push('Hook echo candidate');

        const persistenceScore=
          threeFramePersistent ? 30 :
          twoFramePersistent ? 20 : 0;

        const intensityScore=Math.min(35,Math.max(0,(cluster.maxDbz-45)*1.7));
        const coreScore=Math.min(20,cluster.core50*1.2);
        const structureScore=Math.min(10,cluster.compactness*24);
        const motionScore=stableMotion?5:0;

        const confidence=Math.round(Math.min(
          97,
          persistenceScore+
          intensityScore+
          coreScore+
          structureScore+
          motionScore
        ));

        const primary =
          hook ? {
            label:'Hook echo candidate',
            colour:'#ff4fd8',
            padding:13
          } :
          largeHail ? {
            label:'Large hail signal',
            colour:'#ef4444',
            padding:12
          } :
          mediumHail ? {
            label:'Medium hail signal',
            colour:'#f97316',
            padding:11
          } :
          smallHail ? {
            label:'Small hail signal',
            colour:'#22c55e',
            padding:10
          } : {
            label:'Lightning likelihood',
            colour:'#facc15',
            padding:9
          };

        const warningPoints=createClusterPolygon(
          cluster,
          tileX,
          tileY,
          analysisZoom,
          primary.padding
        );

        const polygon=L.polygon(warningPoints,{
          color:primary.colour,
          weight:7,
          opacity:1,
          fillColor:primary.colour,
          fillOpacity:.09,
          pane:'warningPane',
          lineJoin:'round'
        }).addTo(warningLayer);

        polygon.bindTooltip(primary.label,{
          permanent:true,
          direction:'center',
          className:'storm-hazard-label',
          opacity:.95
        });

        polygon.on('click',async()=>{
          polygon.bindPopup(`
            <div class="warning-popup">
              <b>${primary.label.toUpperCase()}</b><br>
              <span class="badge experimental">EXPERIMENTAL</span><br><br>
              <b>Detected signals:</b><br>
              ${hazards.map(h=>`• ${h}`).join('<br>')}<br><br>
              <b>Maximum reflectivity:</b> ${cluster.maxDbz} dBZ<br>
              <b>Core confidence:</b> ${confidence}%<br>
              <b>Persistence:</b> ${threeFramePersistent?'3 frames':twoFramePersistent?'2 frames':'1 frame'}<br>
              <b>Motion consistency:</b> ${stableMotion?'High':threeFramePersistent?'Low':'Unavailable'}<br><br>
              Finding nearby places…
            </div>
          `).openPopup();

          const places=await impactedPlaces(ll.lat,ll.lon,bearing,30);
          polygon.setPopupContent(`
            <div class="warning-popup">
              <b>${primary.label.toUpperCase()}</b><br>
              <span class="badge experimental">NOT OFFICIAL</span><br><br>
              <b>Detected signals:</b><br>
              ${hazards.map(h=>`• ${h}`).join('<br>')}<br><br>
              <b>Maximum reflectivity:</b> ${cluster.maxDbz} dBZ<br>
              <b>90th-percentile core:</b> ${cluster.p90Dbz} dBZ<br>
              <b>Core confidence:</b> ${confidence}%<br>
              <b>Persistence:</b> ${threeFramePersistent?'3 frames':twoFramePersistent?'2 frames':'1 frame'}<br>
              <b>Motion consistency:</b> ${stableMotion?'High':threeFramePersistent?'Low':'Unavailable'}<br><br>
              <b>Nearby places:</b><br>
              ${places.length?places.map(p=>`• ${p}`).join('<br>'):'No nearby named places returned.'}<br><br>
              The outline follows a persistent calibrated-reflectivity core. Reflectivity alone cannot confirm hail, lightning or tornadoes.
            </div>
          `);
        });

        issued.push(primary.label);
      }

      document.getElementById('summary').innerHTML=issued.length
        ? `<b>${issued.length} experimental polygon${issued.length===1?'':'s'}</b><br>${issued.join('<br>')}<br><br>Each storm has one clean outline. Tap it for all detected signals and nearby places.`
        : '<b>No qualifying intense storm core found.</b><br>Try centring the map on a stronger radar return or use the less strict threshold.';
    }catch(error){
      console.error(error);
      document.getElementById('summary').innerHTML='<b>Analysis could not read radar pixels.</b><br>The radar itself may still display. This usually means the radar tile server blocked browser pixel access.';
    }
  }

    playing=!playing;
    event.target.textContent=playing?'Pause':'Play';
    if(playing)startAnimation();else clearInterval(timer);

  // ------------------------------------------------------------
  // Integrated freehand drawing tool
  // ------------------------------------------------------------
  const drawButton=document.getElementById('fixedDrawButton');
  const drawPanel=document.getElementById('fixedDrawPanel');
  const drawClear=document.querySelector('.fd-clear');
  const drawDone=document.querySelector('.fd-done');
  const drawClose=document.querySelector('.fd-x');
  const drawMapElement=document.getElementById('map');

  if(!map.getPane('drawingPane')){
    map.createPane('drawingPane');
    map.getPane('drawingPane').style.zIndex='720';
  }

  const freehandLayer=L.layerGroup().addTo(map);
  let freehandActive=false;
  let freehandPointer=null;
  let freehandStroke=null;
  let freehandPoints=[];
  let freehandColour='#ff2d2d';

  function setFreehandMode(on){
    freehandActive=on;
    drawPanel.hidden=!on;
    drawButton.classList.toggle('active',on);
    drawMapElement.classList.toggle('fixed-draw-active',on);

    if(on){
      map.dragging.disable();
      if(map.touchZoom) map.touchZoom.disable();
      if(map.doubleClickZoom) map.doubleClickZoom.disable();
      if(map.scrollWheelZoom) map.scrollWheelZoom.disable();
    }else{
      freehandPointer=null;
      freehandStroke=null;
      freehandPoints=[];
      map.dragging.enable();
      if(map.touchZoom) map.touchZoom.enable();
      if(map.doubleClickZoom) map.doubleClickZoom.enable();
      if(map.scrollWheelZoom) map.scrollWheelZoom.enable();
    }
  }

  // Prevent Leaflet from stealing taps on the drawing UI.
  ['pointerdown','pointermove','pointerup','click','touchstart','touchmove','touchend']
    .forEach(type=>{
      document.getElementById('fixedDrawTool').addEventListener(type,event=>{
        event.stopPropagation();
      },{passive:false});
    });

  drawButton.addEventListener('click',event=>{
    event.preventDefault();
    event.stopPropagation();
    setFreehandMode(!freehandActive);
  });

  document.querySelectorAll('.fd-colour').forEach(button=>{
    button.addEventListener('click',event=>{
      event.preventDefault();
      event.stopPropagation();
      freehandColour=button.dataset.colour;
      document.querySelectorAll('.fd-colour').forEach(b=>b.classList.remove('selected'));
      button.classList.add('selected');
    });
  });

  drawClear.addEventListener('click',event=>{
    event.preventDefault();
    freehandLayer.clearLayers();
  });

  drawDone.addEventListener('click',event=>{
    event.preventDefault();
    setFreehandMode(false);
  });

  drawClose.addEventListener('click',event=>{
    event.preventDefault();
    freehandLayer.clearLayers();
    setFreehandMode(false);
  });

  function pointerLatLng(event){
    const rect=drawMapElement.getBoundingClientRect();
    return map.containerPointToLatLng(
      L.point(event.clientX-rect.left,event.clientY-rect.top)
    );
  }

  drawMapElement.addEventListener('pointerdown',event=>{
    if(!freehandActive) return;
    if(event.pointerType==='mouse' && event.button!==0) return;

    event.preventDefault();
    event.stopPropagation();

    freehandPointer=event.pointerId;
    try{drawMapElement.setPointerCapture(event.pointerId)}catch(_){}

    freehandPoints=[pointerLatLng(event)];
    freehandStroke=L.polyline(freehandPoints,{
      color:freehandColour,
      weight:6,
      opacity:.98,
      lineCap:'round',
      lineJoin:'round',
      pane:'drawingPane',
      interactive:false,
      smoothFactor:.15
    }).addTo(freehandLayer);
  },{passive:false});

  drawMapElement.addEventListener('pointermove',event=>{
    if(!freehandActive || freehandPointer!==event.pointerId || !freehandStroke) return;

    event.preventDefault();
    event.stopPropagation();

    const point=pointerLatLng(event);
    const last=freehandPoints[freehandPoints.length-1];
    const a=map.latLngToContainerPoint(last);
    const b=map.latLngToContainerPoint(point);

    if(a.distanceTo(b)<2) return;

    freehandPoints.push(point);
    freehandStroke.setLatLngs(freehandPoints);
  },{passive:false});

  function finishFreehand(event){
    if(freehandPointer!==event.pointerId) return;

    event.preventDefault();
    event.stopPropagation();

    try{drawMapElement.releasePointerCapture(event.pointerId)}catch(_){}
    freehandPointer=null;
    freehandStroke=null;
    freehandPoints=[];
  }

  drawMapElement.addEventListener('pointerup',finishFreehand,{passive:false});
  drawMapElement.addEventListener('pointercancel',finishFreehand,{passive:false});


  loadRadar();
})();
