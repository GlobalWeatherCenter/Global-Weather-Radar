<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live UK Storm Radar</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#app{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#08101c;color:#f5f7fb}
  #app{display:grid;grid-template-rows:auto 1fr}
  header{padding:10px;background:#101827;border-bottom:1px solid #334155;z-index:1000}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  h1{font-size:1rem;margin:0 8px 0 0}
  button,select{border:1px solid #475569;background:#172033;color:#f8fafc;border-radius:9px;padding:8px 10px}
  button{cursor:pointer}
  button.primary{background:#38bdf8;color:#062033;border-color:transparent;font-weight:700}
  .status{font-size:.82rem;color:#b8c4d6}
  #map{height:100%;width:100%;background:#111827}
  .legend,.warningbox{background:rgba(10,18,32,.93);color:#f8fafc;border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:9px 11px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
  .legend{font-size:12px;line-height:1.4}
  .warningbox{max-width:300px;font-size:12px}
  .badge{display:inline-block;border-radius:99px;padding:2px 7px;margin-right:4px;font-weight:700}
  .hail{background:#f59e0b;color:#221400}
  .tornado{background:#ef4444;color:#fff}
  .experimental{background:#8b5cf6;color:#fff}
  .leaflet-container{font:inherit}
  .leaflet-control-attribution{font-size:9px}
  @media(max-width:700px){header .row{align-items:stretch}button,select{flex:1 1 45%}h1{flex:1 1 100%}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <h1>Live UK Storm Radar</h1>
      <button id="play" class="primary">Pause</button>
      <button id="latest">Latest</button>
      <button id="scan">Scan latest radar</button>
      <select id="opacity" aria-label="Radar opacity">
        <option value=".95">Radar 95%</option>
        <option value=".78" selected>Radar 78%</option>
        <option value=".6">Radar 60%</option>
        <option value=".42">Radar 42%</option>
      </select>
      <select id="warnings" aria-label="Experimental warnings">
        <option value="on" selected>Experimental warnings on</option>
        <option value="off">Warnings off</option>
      </select>
      <span id="status" class="status">Loading map and radar…</span>
    </div>
  </header>
  <div id="map"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(() => {
  const map = L.map('map', {zoomControl:true,minZoom:4,maxZoom:12}).setView([54.6,-3.2],6);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© OpenStreetMap contributors'
  }).addTo(map);

  const status = document.getElementById('status');
  const opacityEl = document.getElementById('opacity');
  const warningsEl = document.getElementById('warnings');
  let frames=[], host='', index=0, radar=null, timer=null, playing=true;
  let warningLayers=L.layerGroup().addTo(map);

  const legend=L.control({position:'bottomleft'});
  legend.onAdd=()=>{
    const d=L.DomUtil.create('div','legend');
    d.innerHTML='<b>Experimental detection</b><br><span class="badge hail">HAIL</span> very strong reflectivity<br><span class="badge tornado">TORNADO CANDIDATE</span> hook-like echo heuristic<br><span class="badge experimental">NOT OFFICIAL</span>';
    return d;
  };
  legend.addTo(map);

  const info=L.control({position:'topright'});
  info.onAdd=()=>{
    const d=L.DomUtil.create('div','warningbox');
    d.id='warningInfo';
    d.innerHTML='<b>No experimental polygons yet.</b><br>Press “Scan latest radar”.';
    return d;
  };
  info.addTo(map);

  function tileUrl(frame){
    return `${host}${frame.path}/512/{z}/{x}/{y}/2/1_1.png`;
  }

  function showFrame(i){
    if(!frames.length)return;
    index=Math.max(0,Math.min(i,frames.length-1));
    if(radar)map.removeLayer(radar);
    radar=L.tileLayer(tileUrl(frames[index]),{
      tileSize:512,zoomOffset:-1,maxNativeZoom:7,maxZoom:12,
      opacity:Number(opacityEl.value),crossOrigin:true,
      attribution:'Radar © RainViewer'
    }).addTo(map);
    const t=new Date(frames[index].time*1000);
    status.textContent=`Radar: ${t.toLocaleString('en-GB',{timeZone:'Europe/London'})}`;
  }

  function start(){
    clearInterval(timer);
    timer=setInterval(()=>showFrame(index>=frames.length-1?0:index+1),900);
  }

  async function load(){
    try{
      const r=await fetch('https://api.rainviewer.com/public/weather-maps.json',{cache:'no-store'});
      if(!r.ok)throw new Error('Radar API '+r.status);
      const j=await r.json();
      host=j.host;
      frames=j.radar && j.radar.past ? j.radar.past : [];
      if(!frames.length)throw new Error('No radar frames');
      showFrame(frames.length-1);
      start();
    }catch(e){
      console.error(e);
      status.textContent='Radar failed to load. Open this file in Safari/Chrome with internet access.';
    }
  }

  function mercatorPoint(lat,lon,z){
    const scale=256*Math.pow(2,z);
    const x=(lon+180)/360*scale;
    const s=Math.sin(lat*Math.PI/180);
    const y=(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*scale;
    return {x,y};
  }

  function inverseMercator(x,y,z){
    const scale=256*Math.pow(2,z);
    const lon=x/scale*360-180;
    const n=Math.PI-2*Math.PI*y/scale;
    const lat=180/Math.PI*Math.atan(.5*(Math.exp(n)-Math.exp(-n)));
    return {lat,lon};
  }

  function colourStrength(r,g,b,a){
    if(a<20)return 0;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const sat=max-min;
    // Universal Blue becomes brighter/more saturated with stronger returns.
    return sat*0.65+max*0.35;
  }

  async function analyseLatest(){
    if(!frames.length){status.textContent='Radar is not loaded yet.';return}
    warningLayers.clearLayers();
    document.getElementById('warningInfo').innerHTML='<b>Scanning latest radar…</b>';

    const z=5, size=512, centre={lat:54.6,lon:-3.2};
    const c=mercatorPoint(centre.lat,centre.lon,z);
    const tileSpan=256;
    const xTile=Math.floor(c.x/tileSpan);
    const yTile=Math.floor(c.y/tileSpan);
    const url=`${host}${frames[frames.length-1].path}/${size}/${z}/${xTile}/${yTile}/2/1_1.png`;

    try{
      const img=new Image();
      img.crossOrigin='anonymous';
      await new Promise((resolve,reject)=>{
        img.onload=resolve; img.onerror=reject; img.src=url;
      });

      const canvas=document.createElement('canvas');
      canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d',{willReadFrequently:true});
      ctx.drawImage(img,0,0,size,size);
      const data=ctx.getImageData(0,0,size,size).data;

      const candidates=[];
      const step=8;
      for(let y=0;y<size;y+=step){
        for(let x=0;x<size;x+=step){
          const p=(y*size+x)*4;
          const strength=colourStrength(data[p],data[p+1],data[p+2],data[p+3]);
          if(strength>145)candidates.push({x,y,strength});
        }
      }

      if(!candidates.length){
        document.getElementById('warningInfo').innerHTML='<b>No very strong reflectivity detected</b><br>No experimental polygons issued.';
        return;
      }

      candidates.sort((a,b)=>b.strength-a.strength);
      const clusters=[];
      for(const pt of candidates.slice(0,180)){
        let cst=clusters.find(c=>Math.hypot(c.x-pt.x,c.y-pt.y)<42);
        if(!cst){
          cst={x:pt.x,y:pt.y,n:1,max:pt.strength,pts:[pt]};
          clusters.push(cst);
        }else{
          cst.x=(cst.x*cst.n+pt.x)/(cst.n+1);
          cst.y=(cst.y*cst.n+pt.y)/(cst.n+1);
          cst.n++;cst.max=Math.max(cst.max,pt.strength);cst.pts.push(pt);
        }
      }

      const issued=[];
      for(const cst of clusters.slice(0,6)){
        if(cst.n<3)continue;

        // Convert analysed tile pixels back to approximate Web Mercator coordinates.
        // A 512 image at z corresponds to two standard 256px tiles.
        const worldX=xTile*256+cst.x/2;
        const worldY=yTile*256+cst.y/2;
        const ll=inverseMercator(worldX,worldY,z);

        const radiusKm=cst.max>205?30:cst.max>175?22:15;
        const hailLevel=cst.max>205?'Large hail':cst.max>175?'Medium hail':'Small hail';
        const bounds=L.latLng(ll.lat,ll.lon).toBounds(radiusKm*2000);
        const hailPoly=L.rectangle(bounds,{
          color:'#f59e0b',weight:3,dashArray:'8 5',fillColor:'#f59e0b',fillOpacity:.13
        }).bindPopup(`<b>EXPERIMENTAL ${hailLevel.toUpperCase()} WARNING</b><br>Generated from very strong radar reflectivity only.<br>Not an official warning.`);
        hailPoly.addTo(warningLayers);
        issued.push(hailLevel);

        // Crude hook heuristic: look for a curved/asymmetric arc of strong pixels around cluster centre.
        let arcBins=new Array(12).fill(0);
        for(const p of cst.pts){
          const dx=p.x-cst.x,dy=p.y-cst.y;
          const r=Math.hypot(dx,dy);
          if(r>14&&r<55){
            let a=Math.atan2(dy,dx); if(a<0)a+=Math.PI*2;
            arcBins[Math.floor(a/(Math.PI*2)*12)%12]++;
          }
        }
        let consecutive=0,best=0;
        for(let i=0;i<24;i++){
          if(arcBins[i%12]>0){consecutive++;best=Math.max(best,consecutive)}
          else consecutive=0;
        }
        const emptyBins=arcBins.filter(v=>v===0).length;
        const hookCandidate=best>=4 && best<=8 && emptyBins>=3 && cst.max>185;

        if(hookCandidate){
          const centreLL=L.latLng(ll.lat,ll.lon);
          const tornadoBounds=centreLL.toBounds(26000);
          L.rectangle(tornadoBounds,{
            color:'#ef4444',weight:4,dashArray:'5 4',fillColor:'#ef4444',fillOpacity:.12
          }).bindPopup('<b>EXPERIMENTAL TORNADO WARNING CANDIDATE</b><br>Hook-like reflectivity shape detected.<br>No Doppler velocity confirmation. Not official.')
            .addTo(warningLayers);
          issued.push('Tornado candidate');
        }
      }

      if(!issued.length){
        document.getElementById('warningInfo').innerHTML='<b>No qualifying storm clusters</b><br>Strong pixels were present but did not meet the experimental thresholds.';
      }else{
        document.getElementById('warningInfo').innerHTML=
          `<b>${issued.length} experimental polygon${issued.length===1?'':'s'}</b><br>${issued.join('<br>')}<br><br>These are automated heuristics, not official warnings.`;
      }
    }catch(e){
      console.error(e);
      document.getElementById('warningInfo').innerHTML='<b>Radar analysis unavailable</b><br>The radar provider blocked pixel analysis in this browser. The live radar layer can still display.';
    }
  }

  document.getElementById('play').addEventListener('click',e=>{
    playing=!playing;e.target.textContent=playing?'Pause':'Play';
    if(playing)start();else clearInterval(timer);
  });
  document.getElementById('latest').addEventListener('click',()=>showFrame(frames.length-1));
  document.getElementById('scan').addEventListener('click',analyseLatest);
  opacityEl.addEventListener('change',()=>{if(radar)radar.setOpacity(Number(opacityEl.value))});
  warningsEl.addEventListener('change',()=>{
    if(warningsEl.value==='off'){warningLayers.clearLayers();map.removeLayer(warningLayers)}
    else if(!map.hasLayer(warningLayers))warningLayers.addTo(map);
  });

  load();
})();
</script>
</body>
</html>
